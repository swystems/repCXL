# Inventory file for reference use with VMs. Might be outdated, current benchmarks
# are performed on and tailored to bare-metal.
[servers]
hardanger

[servers:vars]
host_vm_files_dir="repCXL-ansible"
# VM creation config, parameterized to ID (must change for multiple VM)
image_url=https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
image_path="{{ host_vm_files_dir }}/ubuntu2404-server.img"
# defult VM config
vm_id=0
vm_disk_path="{{ host_vm_files_dir }}/vm{{ vm_id }}.qcow2"
cxl_numa_node=0
memory_nodes=3
# force VM re-creation
force=false

[vms]
; p[0:31] ansible_host=hardanger
p0 ansible_host=hardanger

[vms:vars]
ansible_user=
ansible_connection=ssh
ansible_ssh_private_key_file=~/.ssh/ansible_key
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
# paths (remote are relative to wherever SSH lands on) 
local_repo="{{ inventory_dir }}/../../"
local_result_folder="{{ local_repo }}/bench-outputs/"
remote_dir="repCXL-bench"
repcxl_coordinator_id=0
ycsb_remote_source_dir="YCSB"
ycsb_gen_iterations=9

# workload{a,b}_{16,64,128,1024,8192}_{single,medium,large}
ycsb_workload="workloada_{{object_size}}_medium" 

# either a file in config/ or "config/ansible.toml" which is generated 
# with the parameters below
repcxl_num_of_clients=9
process_list="0-{{ repcxl_num_of_clients | int - 1 }}"
logger_cluster_size=3
repcxl_config="config/ansible.toml"
core_affinity="20-120" # isolated cores 
pipeline=false
object_size=8192
algorithm="async_best_effort"
round_time=1200
read_retries=10
; read_offset=0.5

[all:vars]
ansible_python_interpreter=/usr/bin/python3